name: Update image manifest

on:
  push:
    branches: [main]
    paths:
      - 'images/portfolio/**'
      - 'scripts/build-image-manifest.py'
      - '!images/portfolio/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate manifest
        run: python scripts/build-image-manifest.py

      - name: Commit manifest if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/portfolio/manifest.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Update image manifest"
          git pull --rebase origin main
          git push origin HEAD:main
